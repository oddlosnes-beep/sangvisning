name: Bygg Sangvisning-Setup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bygg Android-appen
        shell: bash
        run: |
          set +e
          gradle -p android assembleRelease -Pvcode=${{ github.run_number }} --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error::$(grep -iE 'error|wrong|failed|not found|what went' -A2 build.log | head -25 | tr '\n' '|')"; fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk

  build:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Legg Android-appen i programmet
        shell: bash
        run: cp apk/app-release.apk wwwroot/sangvisning.apk

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Versjon
        shell: bash
        run: echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Publiser (med .NET inni)
        shell: bash
        run: dotnet publish Sangvisning.csproj -c Release -r win-x64 --self-contained true -p:HideConsole=true -p:Version=$VERSION -o publish

      - name: Sjekk at wwwroot er med
        shell: bash
        run: ls publish/wwwroot | head -30

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Bygg Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\Sangvisning.iss

      - name: Lag release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apk/app-release.apk Sangvisning-Android.apk
          gh release create "v$VERSION" installer/Output/Sangvisning-Setup.exe Sangvisning-Android.apk \
            --title "Sangvisning $VERSION" \
            --notes "Last ned Sangvisning-Setup.exe, dobbeltklikk og følg veiviseren."
