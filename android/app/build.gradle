plugins { id 'com.android.application' }
android {
    namespace 'no.sangvisning.app'
    compileSdk 34
    defaultConfig {
        applicationId 'no.sangvisning.app'
        minSdk 24
        targetSdk 34
        versionCode = Integer.parseInt((project.findProperty('vcode') ?: '1').toString())
        versionName '1.0'
    }
    signingConfigs { rel { storeFile file('../sangvisning.keystore'); storePassword 'sangvisning'; keyAlias 'sangvisning'; keyPassword 'sangvisning' } }
    buildTypes { release { signingConfig signingConfigs.rel; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
